<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  #map { width: 100%; height: 100%; display: flex; align-items: flex-start; justify-content: center; position: relative; }
  #frame { position: relative; }
  #frame img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pin { position: absolute; top: 50%; left: 50%; border-radius: 50%; background: #ffffff; box-shadow: 0 0 0 3px #06947c, 0 2px 6px rgba(0,0,0,0.3); opacity: 0; transform: translate(-50%, -50%) scale(1); transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none; }
  .pin.active { opacity: 1; }
  .pin-hit { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; }
</style>
</head>
<body>
<div id="map"><div id="frame"><img src="assets/monterey-county-map.png" alt="Monterey County service area map">
</div></div>
<script>
  var IMAGE_ASPECT = 1982 / 1570;
  var AREAS = [
    { n: 1, name: 'Salinas', nx: 0.2541, ny: 0.2232 },
    { n: 2, name: 'Gonzales', nx: 0.4029, ny: 0.4127 },
    { n: 3, name: 'Soledad', nx: 0.4841, ny: 0.4946 },
    { n: 4, name: 'Greenfield', nx: 0.5257, ny: 0.6022 },
    { n: 5, name: 'King City', nx: 0.6004, ny: 0.7194 },
    { n: 6, name: 'Marina', nx: 0.1733, ny: 0.2258 },
    { n: 7, name: 'Seaside', nx: 0.1473, ny: 0.3245 },
    { n: 8, name: 'Monterey', nx: 0.1009, ny: 0.3306 },
    { n: 9, name: 'Pacific Grove', nx: 0.0868, ny: 0.3105 },
    { n: 10, name: 'Pebble Beach', nx: 0.0716, ny: 0.3522 },
    { n: 11, name: 'Carmel-by-the-Sea', nx: 0.0931, ny: 0.3841 },
    { n: 12, name: 'Carmel Valley', nx: 0.2129, ny: 0.4369 },
    { n: 13, name: 'Big Sur', nx: 0.1572, ny: 0.6580 },
    { n: 14, name: 'Spreckels', nx: 0.2646, ny: 0.2707 },
    { n: 15, name: 'Del Rey Oaks', nx: 0.1350, ny: 0.3525 }
  ];

  var mapEl = document.getElementById('map');
  var frameEl = document.getElementById('frame');
  var pins = {};
  var activeFocus = null, activeHover = null;

  AREAS.forEach(function (a) {
    var hit = document.createElement('div');
    hit.className = 'pin-hit';
    var dot = document.createElement('div');
    dot.className = 'pin';
    hit.appendChild(dot);
    frameEl.appendChild(hit);
    hit.addEventListener('mouseenter', function () { illuminate(a.n); parent.postMessage({ type: 'pinHover', n: a.n }, '*'); });
    hit.addEventListener('mouseleave', function () { illuminate(activeFocus); parent.postMessage({ type: 'pinHover', n: null }, '*'); });
    hit.addEventListener('click', function () { activeFocus = activeFocus === a.n ? null : a.n; illuminate(activeFocus); });
    pins[a.n] = { hit: hit, dot: dot, area: a };
  });

  function illuminate(n) {
    activeHover = n;
    Object.keys(pins).forEach(function (k) {
      var isActive = Number(k) === n;
      pins[k].dot.classList.toggle('active', isActive);
      pins[k].dot.style.transform = 'translate(-50%, -50%) scale(' + (isActive ? 3 : 1) + ')';
    });
  }

  function layout() {
    var mw = mapEl.clientWidth, mh = mapEl.clientHeight;
    var boxAspect = mw / mh;
    var fw, fh;
    if (IMAGE_ASPECT > boxAspect) { fw = mw; fh = mw / IMAGE_ASPECT; }
    else { fh = mh; fw = mh * IMAGE_ASPECT; }
    frameEl.style.width = fw + 'px';
    frameEl.style.height = fh + 'px';
    var dotSize = Math.max(6, fw * (16 / 1734));
    var hitSize = Math.max(24, fw * (44 / 1734));
    Object.keys(pins).forEach(function (k) {
      var p = pins[k];
      var left = p.area.nx * fw, top = p.area.ny * fh;
      p.hit.style.left = left + 'px'; p.hit.style.top = top + 'px';
      p.hit.style.width = hitSize + 'px'; p.hit.style.height = hitSize + 'px';
      p.dot.style.left = '50%'; p.dot.style.top = '50%';
      p.dot.style.width = dotSize + 'px'; p.dot.style.height = dotSize + 'px';
    });
  }

  window.addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(mapEl);
  layout();

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d) return;
    if (d.type === 'focus') { activeFocus = d.n; illuminate(d.n); }
    if (d.type === 'hover') illuminate(d.n !== null && d.n !== undefined ? d.n : activeFocus);
  });
</script>
</body>
</html>
