<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { isPhoneOpen: false };
  _ihfStreetSuffixes = { RD:'Road', ST:'Street', AVE:'Avenue', DR:'Drive', LN:'Lane', CT:'Court', WAY:'Way', BLVD:'Boulevard', PL:'Place', CIR:'Circle', TER:'Terrace', PKWY:'Parkway', HWY:'Highway', LOOP:'Loop', TRL:'Trail', SQ:'Square' };
  _ihfFixTextInRoot = (root) => {
    const cityStateZipRe = /^([A-Za-z .'-]+),\s*([A-Z]{2})\s*(\d{5})$/;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const text = node.nodeValue;
      if (!text || !/[A-Za-z]/.test(text)) continue;
      if (text.includes('Sold Price:')) { node.nodeValue = text.replace('Sold Price:', '').trim(); continue; }
      const filterCountMatch = text.match(/^(Price|Beds|Baths|More)\s*\(\d+\)$/);
      if (filterCountMatch) { node.nodeValue = filterCountMatch[1]; continue; }
      if (node.parentElement && /^\$[\d,]+\+?$/.test(text.trim())) node.parentElement.style.setProperty('font-weight', '700', 'important');
      if (/Start typing to find an area/i.test(text)) node.nodeValue = text.replace(/Start typing to find an area/i, 'City, neighborhood, address...');
      const trimmed = text.trim();
      const cz = trimmed.match(cityStateZipRe);
      if (cz && trimmed === trimmed.toUpperCase()) {
        const fixedCity = cz[1].toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());
        node.nodeValue = text.replace(trimmed, fixedCity + ', ' + cz[2] + ' ' + cz[3]);
        continue;
      }
      let changed = false;
      const fixedText = text.replace(/\b([A-Za-z]{2,6})\b\.?/g, (word, base) => {
        const full = this._ihfStreetSuffixes[base.toUpperCase()];
        if (full) { changed = true; return full; }
        return word;
      });
      if (changed) node.nodeValue = fixedText;
    }
    const ihfDirectText = (el) => { let s = ''; el.childNodes.forEach((n) => { if (n.nodeType === 3) s += n.nodeValue; }); return s.trim(); };
    root.querySelectorAll('*').forEach((el) => {
      const t = ihfDirectText(el);
      if (!t) return;
      if (/^\$[\d,]+\+?$/.test(t) || /^Save Search\b/i.test(t)) {
        el.style.setProperty('font-weight', '700', 'important');
      }
    });
    if (!root.querySelector('style[data-ihf-font-fix]')) {
      const style = document.createElement('style');
      style.setAttribute('data-ihf-font-fix', '1');
      const scopeSel = root === document ? '#ihf-widget-container, #ihf-widget-container *' : ':host, *';

        + ".ui-outlined-input-input { font-size: 14px !important; padding: 8px 4px !important; }"
        + ".ui-outlined-input fieldset { border: none !important; }"
        + ".ihf-email-field, .ui-form-control { max-width: 320px !important; margin-left: auto !important; margin-right: auto !important; }"
        + ".MuiPaper-root:not([class*='listing' i]):not([class*='result' i]):not([class*='gallery' i]) { border: none !important; border-radius: 10px !important; box-shadow: 0 8px 24px rgba(0,0,0,0.10) !important; overflow: hidden !important; padding: 20px 20px 28px 20px !important; box-sizing: border-box !important; margin-top: 10px !important; }"
        + "[role=\"menu\"] { border: none !important; border-radius: 0 !important; box-shadow: none !important; background: transparent !important; padding: 0 !important; margin: 0 !important; }"
        + ".ihf-listing-result-cell, [class*='listing-card' i], [class*='result-cell' i], [class*='gallery-card' i] { border: none !important; box-shadow: none !important; background: none !important; background-color: transparent !important; }"
        + ".ihf-listing-result-status, .ihf-listing-result-status .ui-chip-label, .ihf-listing-result-status span, .ihf-listing-result-badge-open-house, .ihf-listing-result-badge-open-house .ui-chip-label, .ihf-listing-result-badge-open-house span, .ihf-listing-result-badge-virtual-tour, .ihf-listing-result-badge-virtual-tour .ui-chip-label, .ihf-listing-result-badge-virtual-tour span, [class*='open' i][class*='house' i], [class*='virtual' i][class*='tour' i] { font-weight: 700 !important; }"
        + ".MuiCardContent-root:last-child { padding-bottom: 20px !important; }"

        + ".MuiFormControl-root:hover, .MuiAutocomplete-root:hover, .MuiInputBase-root:hover, .MuiFormControl-root:focus-within, .MuiAutocomplete-root:focus-within, .MuiInputBase-root:focus-within { background-size: 100% 100% !important; }"
        + "@keyframes ihfMenuFadeIn { from { opacity: 0; } to { opacity: 1; } }"

        + ".MuiPaper-root:not([class*='listing' i]):not([class*='result' i]):not([class*='gallery' i]), [role='menu'] { animation: ihfMenuFadeIn 0.2s ease !important; }"
        + ".MuiPopover-root.MuiModal-hidden, .MuiPopper-root[style*='visibility: hidden'] { opacity: 0 !important; transition: opacity 0.2s ease !important; }";
      style.textContent += " .MuiFormControl-root:not(#ihf-x):not(#ihf-y), .MuiAutocomplete-root:not(#ihf-x):not(#ihf-y) { background-image: none !important; } .MuiInputBase-root:not(#ihf-x):not(#ihf-y):not([data-ihf-ap=\"card\"] *) { border: none !important; border-bottom: none !important; box-shadow: none !important; background-color: transparent !important; background-image: linear-gradient(to top, #000000 2px, transparent 2px), linear-gradient(to top, #cccccc 1px, transparent 1px) !important; background-repeat: no-repeat !important; background-position: left bottom, left bottom !important; background-size: 0 100%, 100% 100% !important; transition: background-size 0.3s ease !important; } .MuiInputBase-root:not(#ihf-x):not(#ihf-y):not([data-ihf-ap=\"card\"] *):hover, .MuiInputBase-root:not(#ihf-x):not(#ihf-y):not([data-ihf-ap=\"card\"] *):focus-within { background-size: 100% 100%, 100% 100% !important; } .MuiInputBase-root:not(#ihf-x):not(#ihf-y):not([data-ihf-ap=\"card\"] *)::before, .MuiInputBase-root:not(#ihf-x):not(#ihf-y):not([data-ihf-ap=\"card\"] *)::after { display: none !important; content: none !important; border: none !important; } .MuiInputBase-root:not(#ihf-x):not(#ihf-y):not([data-ihf-ap=\"card\"] *) fieldset, .MuiInputBase-root:not(#ihf-x):not(#ihf-y):not([data-ihf-ap=\"card\"] *) .MuiOutlinedInput-notchedOutline { border: none !important; }";
      (root === document ? document.head : root).appendChild(style);
    }
    this._ihfMoveResultsCount(root);
    this._ihfTraceHearts(root);
    // link-href rewrite disabled — testing native widget href now that site URL config is fixed
    root.querySelectorAll('*').forEach((el) => { if (el.shadowRoot) this._ihfFixTextInRoot(el.shadowRoot); });
  };
  _ihfMoveResultsCount = (root) => {
    const leaves = Array.from(root.querySelectorAll('*'));
    const directText = (el) => { let s = ''; el.childNodes.forEach((n) => { if (n.nodeType === 3) s += n.nodeValue; }); return s.trim(); };
    const resultsEl = leaves.find((el) => !el.children.length && /^\d[\d,]*\s*results?$/i.test(directText(el)));
    const mapEl = leaves.find((el) => !el.children.length && /^map$/i.test(directText(el)));
    if (!resultsEl || !mapEl || !mapEl.parentElement) return;
    const resultsRow = resultsEl.parentElement;
    if (resultsRow && resultsRow !== mapEl.parentElement) resultsRow.style.setProperty('display', 'none', 'important');
    let clone = root.querySelector('[data-ihf-results-clone]');
    if (!clone) {
      clone = document.createElement('span');
      clone.setAttribute('data-ihf-results-clone', '1');
      clone.style.marginLeft = '12px';
      clone.style.fontSize = '14px';
      clone.style.color = 'inherit';
      clone.style.fontFamily = 'inherit';
      clone.style.whiteSpace = 'nowrap';
    }
    const t = directText(resultsEl);
    if (clone.textContent !== t) clone.textContent = t;
    if (clone.parentElement !== mapEl.parentElement || clone.previousElementSibling !== mapEl) {
      mapEl.parentElement.insertBefore(clone, mapEl.nextSibling);
    }
  };
  _ihfTraceHearts = (root) => {
    root.querySelectorAll('.ihf-listing-result-badge-fav').forEach((btn) => {
      if (btn.dataset.heartTraced) return;
      const svg = btn.querySelector('svg');
      if (!svg || !svg.querySelector('path')) return;
      btn.dataset.heartTraced = '1';
      if (getComputedStyle(btn).position === 'static') btn.style.position = 'relative';
      const clone = svg.cloneNode(true);
      clone.classList.add('heart-trace-clone');
      clone.style.position = 'absolute';
      clone.style.inset = '0';
      clone.style.pointerEvents = 'none';
      clone.style.overflow = 'visible';
      clone.querySelectorAll('path').forEach((p) => {
        let len = 40;
        try { len = p.getTotalLength(); } catch (e) {}
        p.style.fill = 'none';
        p.style.stroke = '#e53935';
        p.style.strokeWidth = '2';
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      svg.insertAdjacentElement('afterend', clone);
    });
  };
  _ihfFixListingLinks = (root) => {
    root.querySelectorAll('.ihf-listing-result-cell, [class*="listing-result-cell" i], [class*="listing-card" i], [class*="gallery-card" i]').forEach((card) => {
      if (card._ihfLinkFixed) return;
      const img = card.querySelector('img[src*="/property/"]');
      const link = card.querySelector('a[href]');
      if (!img || !link) return;
      const m = img.src.match(/\/property\/([A-Za-z]+)\/(\d+)\//);
      if (!m) return;
      card._ihfLinkFixed = true;
      link.setAttribute('href', 'https://jacksonkesecker.com/listing?id=' + m[2]);
    });
  };
  _ihfFixCloseButtons = (root) => {
    root.querySelectorAll('.MuiIconButton-root').forEach((btn) => {
      if (btn._ihfCloseHoverBound) return;
      const svg = btn.querySelector('svg');
      if (!svg || !svg.querySelector('line')) return;
      btn._ihfCloseHoverBound = true;
      btn.addEventListener('mouseenter', () => { svg.style.setProperty('color', '#999999', 'important'); svg.querySelectorAll('line').forEach((l) => l.style.setProperty('stroke', '#999999', 'important')); });
      btn.addEventListener('mouseleave', () => { svg.style.removeProperty('color'); svg.querySelectorAll('line').forEach((l) => l.style.removeProperty('stroke')); });
    });
  };
  _ihfFixTitleAttrs = (root) => {
    root.querySelectorAll('[title]').forEach((el) => {
      const raw = el.getAttribute('title');
      if (!raw || el.dataset.ihfTitleFixed === raw) return;
      const cityMatch = raw.match(/\b([A-Z]{2,}(?:[ .'-][A-Z]{2,})*),\s*([A-Z]{2})\b/);
      if (!cityMatch) return;
      let street = raw.slice(0, cityMatch.index).trim().replace(/,$/, '');
      const zipMatch = raw.slice(cityMatch.index).match(/(\d{5})/);
      if (!zipMatch) return;
      let cityWords = cityMatch[1].trim().split(/\s+/);
      if (cityWords.length > 1 && this._ihfStreetSuffixes[cityWords[0].toUpperCase()]) {
        street = (street + ' ' + cityWords[0]).trim();
        cityWords = cityWords.slice(1);
      }
      const city = cityWords.join(' ').toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());
      const state = cityMatch[2].toUpperCase();
      const zip = zipMatch[1];
      const streetWords = street.split(/\s+/);
      const last = streetWords[streetWords.length - 1].replace(/\.$/, '');
      const suf = this._ihfStreetSuffixes[last.toUpperCase()];
      if (suf) { streetWords[streetWords.length - 1] = suf; street = streetWords.join(' '); }
      const fixed = street + ', ' + city + ', ' + state + ' ' + zip;
      if (fixed === raw) return;
      el.dataset.ihfTitleFixed = fixed;
      el.setAttribute('title', fixed);
    });
  };
  _ihfFixAllShadowRoots = () => {
    this._ihfFixTextInRoot(document);
    this._ihfFixCloseButtons(document);
    this._ihfFixTitleAttrs(document);
    if (!this._ihfShadowFadeRoots) this._ihfShadowFadeRoots = new WeakSet();
    document.querySelectorAll('*').forEach((el) => {
      const sr = el.shadowRoot;
      if (!sr) return;
      this._ihfFixTextInRoot(sr);
      this._ihfFixCloseButtons(sr);
      this._ihfFixTitleAttrs(sr);
      if (this._ihfShadowFadeRoots.has(sr)) return;
      this._ihfShadowFadeRoots.add(sr);
      const srMo = new MutationObserver(() => this._ihfFixAllShadowRoots());
      srMo.observe(sr, { childList: true, subtree: true, attributes: true, attributeFilter: ['src', 'title'] });
    });
  };
  _ihfStartCaseFix = () => {
    if (this._ihfCaseFixStarted) return;
    this._ihfCaseFixStarted = true;
    if (!document.getElementById('ihf-modal-fix')) {
      const s = document.createElement('style');
      s.id = 'ihf-modal-fix';
      s.textContent = "div.ihf-overlay-container { position: fixed !important; top: 0 !important; left: 0 !important; }"
        + ".ui-typography-h3 { text-align: center !important; font-size: 22px !important; }"
        + ".ui-typography-body1 { text-align: center !important; font-size: 14px !important; }"
        + ".ui-outlined-input { border: none !important; border-bottom: 1px solid #cccccc !important; border-radius: 0 !important; box-shadow: none !important; padding-left: 4px !important; }"
        + ".ui-outlined-input-input { font-size: 14px !important; padding: 8px 4px !important; }"
        + ".ui-outlined-input fieldset { border: none !important; }"
        + ".ihf-email-field, .ui-form-control { max-width: 320px !important; margin-left: auto !important; margin-right: auto !important; }"
        + "[aria-label*='close' i], button[aria-label*='close' i] svg, .MuiDialog-root [aria-label*='close' i], .MuiModal-root [aria-label*='close' i] { transition: color 0.2s ease, opacity 0.2s ease !important; }"
        + "[aria-label*='close' i]:hover, button[aria-label*='close' i]:hover svg, .MuiDialog-root [aria-label*='close' i]:hover, .MuiModal-root [aria-label*='close' i]:hover { color: #999999 !important; fill: #999999 !important; opacity: 0.65 !important; }"
        + ".MuiDialog-root .MuiIconButton-root, .MuiModal-root .MuiIconButton-root, .MuiDialog-root button svg, .MuiModal-root button svg { transition: color 0.2s ease, opacity 0.2s ease, fill 0.2s ease !important; }"
        + ".MuiDialog-root .MuiIconButton-root:hover, .MuiModal-root .MuiIconButton-root:hover, .MuiDialog-root button:hover svg, .MuiModal-root button:hover svg { color: #999999 !important; fill: #999999 !important; opacity: 0.65 !important; }"
        + ".MuiDialog-paper .MuiIconButton-root svg, .MuiDialog-paper .MuiIconButton-root svg line { transition: color 0.2s ease, stroke 0.2s ease, opacity 0.2s ease !important; }"
        + ".MuiDialog-paper .MuiIconButton-root:hover svg, .MuiDialog-paper .MuiIconButton-root:hover svg line { color: #999999 !important; stroke: #999999 !important; opacity: 0.65 !important; }";
      document.head.appendChild(s);
    }
    if (!this._ihfMo) {
      this._ihfMo = new MutationObserver(() => this._ihfFixAllShadowRoots());
      this._ihfMo.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
    }
    this._ihfFixAllShadowRoots();
  };
  _ihfPrefillSearch = () => {
    const q = (new URLSearchParams(window.location.search).get('q') || '').trim();
    if (!q || this._ihfPrefillStarted) return;
    this._ihfPrefillStarted = true;
    const start = Date.now();
    const setVal = (inp, v) => {
      const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
      setter.call(inp, v);
      inp.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
    };
    const roots = () => {
      const out = [document];
      document.querySelectorAll('div.ihf-container, div.ihf-overlay-container').forEach((h) => { if (h.shadowRoot) out.push(h.shadowRoot); });
      return out;
    };
    const findInput = () => {
      for (const r of roots()) {
        const inp = Array.from(r.querySelectorAll('input')).find((i) => /start|search|area|find/i.test(i.getAttribute('placeholder') || ''));
        if (inp) return inp;
      }
      return null;
    };
    const pickOption = (inp) => {
      const t0 = Date.now();
      const tryPick = () => {
        let opts = [];
        roots().forEach((r) => { opts = opts.concat(Array.from(r.querySelectorAll('[role="option"], li.MuiAutocomplete-option'))); });
        opts = opts.filter((o) => o.offsetParent !== null && (o.textContent || '').trim());
        if (opts.length) {
          const ql = q.toLowerCase();
          const best = opts.find((o) => (o.textContent || '').trim().toLowerCase().startsWith(ql)) || opts[0];
          best.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, composed: true }));
          best.click();
          return;
        }
        if (Date.now() - t0 < 6000) setTimeout(tryPick, 150);
        else inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, bubbles: true, composed: true }));
      };
      tryPick();
    };
    const tick = () => {
      const inp = findInput();
      if (inp) {
        inp.focus();
        inp.click();
        setVal(inp, q);
        setTimeout(() => pickOption(inp), 250);
        return;
      }
      if (Date.now() - start < 15000) setTimeout(tick, 200);
    };
    setTimeout(tick, 400);
  };
  ihfListingSearchRef = (node) => {
    if (!node || node.dataset.ihfMounted) return;
    const doMount = () => {
      if (node.dataset.ihfMounted) return;
      node.dataset.ihfMounted = '1';
      node.appendChild(window.ihfKestrel.render({ component: 'listingSearchWidget' }));
      this._ihfStartCaseFix();
    };
    setTimeout(() => this._ihfPrefillSearch(), 0);
    if (window.ihfKestrel && window.ihfKestrel.render) { doMount(); return; }
    const ks = document.querySelector('script[src*="ihf-kestrel.js"]');
    if (ks) ks.addEventListener('load', doMount, { once: true });
  };
  openContactModal = (e) => { if (e) e.preventDefault(); if (window.openKeseckerContactModal) window.openKeseckerContactModal(); };

  onPhoneClose = () => this.setState({ isPhoneOpen: false });
  _navVals = () => {
    const s = this.state || {};
    const close = () => {
      if (!s.navMenuOpen && !(this.state && this.state.navMenuOpen)) return;
      this.setState({ navMenuClosing: true });
      clearTimeout(this._navT);
      this._navT = setTimeout(() => this.setState({ navMenuOpen: false, navMenuClosing: false }), 300);
    };
    return {
      navMenuOpen: !!s.navMenuOpen,
      navOverlayAnim: s.navMenuClosing ? 'navm-fade-out 0.3s ease forwards' : 'navm-fade-in 0.35s ease',

      navBurgerTransform: (s.navMenuOpen && !s.navMenuClosing) ? 'rotateY(180deg)' : 'rotateY(0deg)',
      toggleNavMenu: (e) => { if (e && e.preventDefault) e.preventDefault(); if (this.state && this.state.navMenuOpen) close(); else { clearTimeout(this._navT); this.setState({ navMenuOpen: true, navMenuClosing: false }); } },
      closeNavMenu: () => close(),
      stopNavProp: (e) => e.stopPropagation(),
      navMenuContact: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        close();
        setTimeout(() => { const v = this.renderVals(); if (v && v.openContactModal) v.openContactModal(); }, 300);
      },
    };
  };
  renderVals() {
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q') || '';
    return {
      ...this._navVals(),
      ihfListingSearchRef: this.ihfListingSearchRef, hasQuery: false, queryValue: q,
      openContactModal: this.openContactModal,
      isPhoneOpen: this.state.isPhoneOpen, togglePhonePopup: this.togglePhonePopup, onPhoneClose: this.onPhoneClose,
      phonePopoverStyle: this.state.isPhoneOpen ? 'opacity:1;visibility:visible;transform:translateY(0);transition:opacity 0.3s ease,transform 0.3s ease;' : 'opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity 0.3s ease,transform 0.3s ease;',
    };
  }
}
