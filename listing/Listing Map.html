<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #666; background: #ffffff; }
</style>
</head>
<body>
<div id="status">Loading map…</div>
<div id="map" style="display:none;"></div>
<script>
  const params = new URLSearchParams(location.search);
  const address = params.get('address') || '';
  const statusEl = document.getElementById('status');
  const mapEl = document.getElementById('map');
  if (!address) {
    statusEl.textContent = 'No address provided.'; try { parent.postMessage({ type: 'ihf-map-failed' }, '*'); } catch (e) {}
  } else {
    const fail = (msg) => {
      statusEl.textContent = msg;
      try { parent.postMessage({ type: 'ihf-map-failed' }, '*'); } catch (e) {}
    };
    const clean = address.replace(/\s*\|\s*/g, ', ').replace(/\s+/g, ' ').trim();
    const noUnit = clean.replace(/\s+(#|unit|apt|ste|suite)\s*[\w-]+/i, '').replace(/^(\d+\s+[^,]+?)\s+\d+[A-Za-z]?(?=,)/, '$1');
    const cityPart = (clean.match(/,\s*([^,]+,\s*[A-Z]{2}\s*\d{5})/) || [])[1] || '';
    const queries = [clean, noUnit, cityPart].filter((q, i, a) => q && a.indexOf(q) === i);
    const tryNext = (i) => {
      if (i >= queries.length) { fail('Location not found.'); return; }
      fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=' + encodeURIComponent(queries[i]))
        .then((r) => r.json())
        .then((results) => {
          if (!results || !results.length) { tryNext(i + 1); return; }
          const lat = parseFloat(results[0].lat);
          const lon = parseFloat(results[0].lon);
          statusEl.style.display = 'none';
          mapEl.style.display = 'block';
          const map = L.map('map', { scrollWheelZoom: false }).setView([lat, lon], i === queries.length - 1 && cityPart ? 13 : 15);
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
          }).addTo(map);
          L.marker([lat, lon]).addTo(map);
        })
        .catch(() => tryNext(i + 1));
    };
    tryNext(0);
    setTimeout(() => { if (mapEl.style.display === 'none') fail('Map unavailable.'); }, 15000);
  }
</script>
</body>
</html>
