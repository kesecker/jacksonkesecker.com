name: Update mortgage rate

on:
  schedule:
    - cron: "0 18 * * 4"   # Thursdays ~11am PT, after Freddie Mac publishes
    - cron: "0 18 * * 5"   # Friday retry (holiday weeks publish late)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest 30-yr fixed average
        run: |
          set -e
          curl -fsSL --retry 3 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=MORTGAGE30US" -o rate.csv
          LAST=$(grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2},[0-9.]+' rate.csv | tail -n 1)
          DATE=${LAST%%,*}
          RATE=${LAST##*,}
          if [ -z "$RATE" ]; then echo "No rate parsed"; exit 1; fi
          printf '{\n  "rate30": %s,\n  "date": "%s",\n  "source": "Freddie Mac PMMS (via FRED MORTGAGE30US)"\n}\n' "$RATE" "$DATE" > mortgage-rate.json
          rm rate.csv
          cat mortgage-rate.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- mortgage-rate.json; then echo "No change"; exit 0; fi
          git config user.name "rate-bot"
          git config user.email "rate-bot@users.noreply.github.com"
          git add mortgage-rate.json
          git commit -m "Update mortgage rate"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying"; sleep $((i * 5))
          done
          exit 1
