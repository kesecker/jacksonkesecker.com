<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="icon" type="image/png" href="assets/favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="assets/favicon-light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="assets/favicon-light.png">
  <script src="https://kestrel.idxhome.com/ihf-kestrel.js"></script>
  <script>
    window.ihfKestrel = window.ihfKestrel || {};
    ihfKestrel.config = {
      platform: "custom",
      activationToken: "84ee0119-74ff-4a71-885e-a3cc7e030850",
    };
  </script>
  <link rel="stylesheet" href="_ds/realty-hub-design-system-dc2b1855-61ad-4be7-8677-8c19514f7cae/styles.css">
  <script>
    (function loadDsBundle() {
      if (window.React) {
        var s = document.createElement('script');
        s.src = '_ds/realty-hub-design-system-dc2b1855-61ad-4be7-8677-8c19514f7cae/_ds_bundle.js';
        document.head.appendChild(s);
      } else {
        setTimeout(loadDsBundle, 10);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Lexend:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rh-font: 'Montserrat', system-ui, sans-serif;
      --rh-accent: #1a1a1a;
      --rh-accent-hover: #000000;
      --rh-accent-light: #ededed;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--rh-bg); letter-spacing: 0.015em; }
    @keyframes modal-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modal-fade-out { from { opacity: 1; } to { opacity: 0; } }
    a { color: var(--rh-accent); text-decoration: none; }
    a:hover { color: var(--rh-accent-hover); }
    .vc-eyebrow { font-family: var(--rh-font); font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--rh-accent); }
  </style>
</helmet>

<div style="font-family: var(--rh-font); color: var(--rh-text-primary); background: var(--rh-bg); width: 100%; height: 100vh; overflow: hidden; display: flex; flex-direction: column;">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 0 clamp(20px, 4vw, 48px) 0 clamp(8px, 1.5vw, 18px); height: 92px; background: #000000; flex-wrap: wrap; flex-shrink: 0;">
    <a href="https://jacksonkesecker.com/" target="_self" style="display: flex; align-items: center; flex-shrink: 0;">
      <img src="assets/key-landing-logo.png" alt="Jackson Kesecker Realtor" style="height: 34px; width: auto;">
    </a>
    <div style="display: flex; align-items: center; gap: clamp(14px, 2.4vw, 26px); flex: 1; padding-left: clamp(8px, 2vw, 28px);">
      <span style="font-size: 14px; font-weight: 500; color: #ffffff;">Search</span>
      <span style="font-size: 30px; line-height: 1; display: flex; align-items: center; color: #ffffff;">•</span>
      <a href="../communities" style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.75);" style-hover="color: #ffffff;">Communities</a>
      <span style="font-size: 30px; line-height: 1; display: flex; align-items: center; color: #ffffff;">•</span>
      <a href="../about" style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.75);" style-hover="color: #ffffff;">About</a>
    </div>
<a href="#" onClick="{{ openContactModal }}" style="font-size: 13px; font-weight: 600; color: #ffffff; flex-shrink: 0;">Contact</a>
    <dc-import name="ContactModal" hint-size="0,0"></dc-import>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; width: 100%; box-sizing: border-box;">
    <sc-if value="{{ hasQuery }}" hint-placeholder-val="{{ false }}">
      <div style="font-size: 13px; color: var(--rh-text-secondary); padding: 12px clamp(16px, 2.5vw, 32px) 0; flex-shrink: 0;">Showing search for: <strong style="color: var(--rh-text-primary);">{{ queryValue }}</strong></div>
    </sc-if>
    <div style="flex: 1; overflow-y: auto;">
      <div id="ihf-widget-container" ref="{{ ihfListingSearchRef }}" style="width: 100%; height: 100%; padding: 0 36px 20px; box-sizing: border-box;"></div>
    </div>
  </div>

  <sc-if value="{{ isPhoneOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ onPhoneClose }}" style="position: fixed; inset: 0; z-index: 299; background: transparent;"></div>
  </sc-if>
  <div style="position: fixed; right: 24px; bottom: 24px; z-index: 300; width: 56px; height: 56px;">
    <div style="{{ phonePopoverStyle }} position: absolute; right: 0; bottom: 70px; width: 260px; background: #141414; border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; padding: 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.4);">
      <div style="display: flex; justify-content: flex-end;"><span onClick="{{ onPhoneClose }}" style="color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1; cursor: pointer;">✕</span></div>
      <p style="font-size: 20px; font-weight: 600; color: #ffffff; text-align: center; margin: -8px 0 4px;">Questions?</p>
      <p style="font-size: 14px; color: rgba(255,255,255,0.85); text-align: center; margin: 0 0 12px;">Call or text today, we are here to help!</p>
      <p style="margin: 0 0 16px; text-align: center;"><a href="tel:+18318210398" style="font-size: 22px; font-weight: 700; color: #ffffff; text-decoration: none;">(831) 821-0398</a></p>
      <p style="font-size: 11px; line-height: 1.6; color: rgba(255,255,255,0.55); text-align: center; margin: 0;">I agree to be contacted by Jackson Kesecker via text, call &amp; email.</p>
    </div>
    <button onClick="{{ togglePhonePopup }}" aria-label="Call or text" style="width: 56px; height: 56px; border-radius: 50%; background: #1a1a1a; color: #ffffff; border: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.3);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
    </button>
  </div>

  <dc-import name="AccessibilityWidget" hint-size="56px,56px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { isPhoneOpen: false };
  _ihfStreetSuffixes = { RD:'Road', ST:'Street', AVE:'Avenue', DR:'Drive', LN:'Lane', CT:'Court', WAY:'Way', BLVD:'Boulevard', PL:'Place', CIR:'Circle', TER:'Terrace', PKWY:'Parkway', HWY:'Highway', LOOP:'Loop', TRL:'Trail', SQ:'Square' };
  _ihfFixTextInRoot = (root) => {
    const cityStateZipRe = /^([A-Za-z .'-]+),\s*([A-Z]{2})\s*(\d{5})$/;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const text = node.nodeValue;
      if (!text || !/[A-Za-z]/.test(text)) continue;
      if (text.includes('Sold Price:')) { node.nodeValue = text.replace('Sold Price:', '').trim(); continue; }
      const filterCountMatch = text.match(/^(Price|Beds|Baths|More)\s*\(\d+\)$/);
      if (filterCountMatch) { node.nodeValue = filterCountMatch[1]; continue; }
      const trimmed = text.trim();
      const cz = trimmed.match(cityStateZipRe);
      if (cz && trimmed === trimmed.toUpperCase()) {
        const fixedCity = cz[1].toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());
        node.nodeValue = text.replace(trimmed, fixedCity + ', ' + cz[2] + ' ' + cz[3]);
        continue;
      }
      let changed = false;
      const fixedText = text.replace(/\b([A-Za-z]{2,6})\b\.?/g, (word, base) => {
        const full = this._ihfStreetSuffixes[base.toUpperCase()];
        if (full) { changed = true; return full; }
        return word;
      });
      if (changed) node.nodeValue = fixedText;
    }
    if (!root.querySelector('style[data-ihf-font-fix]')) {
      const style = document.createElement('style');
      style.setAttribute('data-ihf-font-fix', '1');
      style.textContent = ":host, * { --rh-font: 'Inter', system-ui, sans-serif !important; font-family: 'Inter', system-ui, sans-serif !important; }"
        + ".ui-typography-h3 { text-align: center !important; font-size: 22px !important; }"
        + ".ui-typography-body1 { text-align: center !important; font-size: 14px !important; }"
        + ".ui-outlined-input { border: none !important; border-bottom: 1px solid #cccccc !important; border-radius: 0 !important; box-shadow: none !important; padding-left: 4px !important; }"
        + ".ui-outlined-input-input { font-size: 14px !important; padding: 8px 4px !important; }"
        + ".ui-outlined-input fieldset { border: none !important; }"
        + ".ihf-email-field, .ui-form-control { max-width: 320px !important; margin-left: auto !important; margin-right: auto !important; }"
        + "[role=\"menu\"], .MuiPaper-root:not([class*='listing' i]):not([class*='result' i]):not([class*='gallery' i]) { border: none !important; border-radius: 10px !important; box-shadow: 0 8px 24px rgba(0,0,0,0.10) !important; overflow: hidden !important; padding: 20px 20px 28px 20px !important; box-sizing: border-box !important; margin-top: 10px !important; }"
        + ".ihf-listing-result-cell, [class*='listing-card' i], [class*='result-cell' i], [class*='gallery-card' i] { border: none !important; box-shadow: none !important; }"
        + ".MuiCardContent-root:last-child { padding-bottom: 20px !important; }"
        + ".MuiMenuItem-root, [role=\"menu\"] li[role=\"menuitem\"] { position: relative !important; border-bottom: none !important; box-shadow: none !important; outline: none !important; min-height: 40px !important; box-sizing: border-box !important; }"
        + ".MuiMenuItem-root:focus, [role=\"menu\"] li[role=\"menuitem\"]:focus { outline: none !important; box-shadow: none !important; }"
        + ".MuiMenuItem-root:hover, .MuiMenuItem-root.Mui-selected, [role=\"menu\"] li[role=\"menuitem\"]:hover { background-color: transparent !important; }"
        + ".MuiMenuItem-root, [role=\"menu\"] li[role=\"menuitem\"] { background-image: linear-gradient(#000000, #000000) !important; background-repeat: no-repeat !important; background-position: 20px calc(100% - 6px) !important; background-size: 0 2px !important; transition: background-size 0.3s ease !important; }"
        + ".MuiMenuItem-root, [role=\"menu\"] li[role=\"menuitem\"] { box-sizing: border-box !important; }"
        + ".MuiMenuItem-root:hover, [role=\"menu\"] li[role=\"menuitem\"]:hover { background-size: calc(100% - 40px) 2px !important; }"
        + ".MuiTouchRipple-root { display: none !important; }"
        + ".MuiToggleButton-root, [role=\"group\"] button, .MuiButtonGroup-grouped, .ihf-list-toggle-button, .ihf-map-toggle-button { background: transparent !important; background-color: transparent !important; border: none !important; box-shadow: none !important; border-radius: 0 !important; color: #000000 !important; position: relative !important; }"
        + ".MuiToggleButton-root.Mui-selected, [role=\"group\"] button.Mui-selected, .MuiButtonGroup-grouped.Mui-selected, .ihf-list-toggle-button.MuiButton-containedPrimary, .ihf-map-toggle-button.MuiButton-containedPrimary, .MuiToggleButton-root.Mui-selected:hover, [role=\"group\"] button.Mui-selected:hover, .ihf-list-toggle-button.MuiButton-containedPrimary:hover, .ihf-map-toggle-button.MuiButton-containedPrimary:hover { background: transparent !important; background-color: transparent !important; box-shadow: none !important; border: none !important; color: #000000 !important; }"
        + ".MuiToggleButton-root::after, [role=\"group\"] button::after, .MuiButtonGroup-grouped::after, .ihf-list-toggle-button::after, .ihf-map-toggle-button::after { content: \"\"; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 2px; background: #000000; transform: scaleX(0); transition: transform 0.3s ease; }"
        + ".MuiToggleButton-root:hover::after, [role=\"group\"] button:hover::after, .MuiButtonGroup-grouped:hover::after, .ihf-list-toggle-button:hover::after, .ihf-map-toggle-button:hover::after, .MuiToggleButton-root.Mui-selected::after, [role=\"group\"] button.Mui-selected::after, .MuiButtonGroup-grouped.Mui-selected::after, .ihf-list-toggle-button.MuiButton-containedPrimary::after, .ihf-map-toggle-button.MuiButton-containedPrimary::after { transform: scaleX(1) !important; }"
        + ".ihf-list-toggle-button svg, .ihf-map-toggle-button svg, .ihf-list-toggle-button .MuiButton-startIcon, .ihf-map-toggle-button .MuiButton-startIcon { margin-right: 4px !important; }"
        + ".ihf-list-toggle-button::after, .ihf-map-toggle-button::after { left: 30px !important; right: 8px !important; }"
        + ".MuiButton-containedPrimary { background-color: #000000 !important; border-radius: 8px !important; box-shadow: none !important; } .MuiButton-containedPrimary:hover { background-color: #1a1a1a !important; }"
        + ".MuiSlider-root { color: #000000 !important; } .MuiSlider-thumb { border: 2px solid #ffffff !important; box-shadow: 0 1px 4px rgba(0,0,0,0.35) !important; } .MuiSlider-rail { opacity: 0.25 !important; } .MuiSlider-valueLabel { background: #000000 !important; }"
        + ".MuiOutlinedInput-root { border: none !important; border-bottom: 1px solid #cccccc !important; border-radius: 0 !important; box-shadow: none !important; } .MuiOutlinedInput-notchedOutline { border: none !important; } .MuiOutlinedInput-input, .MuiSelect-root { padding-left: 4px !important; }"
        + ".MuiOutlinedInput-root, .MuiOutlinedInput-root:hover, .MuiOutlinedInput-root.Mui-focused, .MuiFilledInput-root, .MuiFilledInput-root:hover, .MuiFilledInput-root.Mui-focused, .MuiInputBase-root, .MuiInputBase-root:hover, .MuiInputBase-root.Mui-focused { background-color: transparent !important; background: transparent !important; transition: border-bottom-color 0.3s ease; }"
        + "[class*='Input' i], [class*='Input' i]:hover, [class*='Input' i]:focus, [class*='Input' i].Mui-focused, [class*='Input' i] input { background-color: transparent !important; background-image: none !important; }"
        + ".MuiOutlinedInput-root:hover, .MuiFilledInput-root:hover, .MuiInputBase-root:hover { border-bottom-color: #888888 !important; }"
        + ".MuiOutlinedInput-root.Mui-focused, .MuiFilledInput-root.Mui-focused, .MuiInputBase-root.Mui-focused { border-bottom: 2px solid #000000 !important; }"
        + ".heart-trace-clone path { transition: stroke-dashoffset 0.6s ease; } .ihf-listing-result-badge-fav:hover .heart-trace-clone path, .ihf-listing-result-badge-fav svg[fill=\"currentColor\"] ~ .heart-trace-clone path { stroke-dashoffset: 0 !important; }";
      root.appendChild(style);
    }
    this._ihfTraceHearts(root);
    root.querySelectorAll('*').forEach((el) => { if (el.shadowRoot) this._ihfFixTextInRoot(el.shadowRoot); });
  };
  _ihfTraceHearts = (root) => {
    root.querySelectorAll('.ihf-listing-result-badge-fav').forEach((btn) => {
      if (btn.dataset.heartTraced) return;
      const svg = btn.querySelector('svg');
      if (!svg || !svg.querySelector('path')) return;
      btn.dataset.heartTraced = '1';
      if (getComputedStyle(btn).position === 'static') btn.style.position = 'relative';
      const clone = svg.cloneNode(true);
      clone.classList.add('heart-trace-clone');
      clone.style.position = 'absolute';
      clone.style.inset = '0';
      clone.style.pointerEvents = 'none';
      clone.style.overflow = 'visible';
      clone.querySelectorAll('path').forEach((p) => {
        let len = 40;
        try { len = p.getTotalLength(); } catch (e) {}
        p.style.fill = 'none';
        p.style.stroke = '#e53935';
        p.style.strokeWidth = '2';
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      svg.insertAdjacentElement('afterend', clone);
    });
  };
  _ihfFixAllShadowRoots = () => {
    document.querySelectorAll('*').forEach((el) => {
      if (el.shadowRoot) this._ihfFixTextInRoot(el.shadowRoot);
    });
  };
  _ihfStartCaseFix = () => {
    if (this._ihfCaseFixStarted) return;
    this._ihfCaseFixStarted = true;
    if (!document.getElementById('ihf-modal-fix')) {
      const s = document.createElement('style');
      s.id = 'ihf-modal-fix';
      s.textContent = "div.ihf-overlay-container { position: fixed !important; top: 0 !important; left: 0 !important; }"
        + ".ui-typography-h3 { text-align: center !important; font-size: 22px !important; }"
        + ".ui-typography-body1 { text-align: center !important; font-size: 14px !important; }"
        + ".ui-outlined-input { border: none !important; border-bottom: 1px solid #cccccc !important; border-radius: 0 !important; box-shadow: none !important; padding-left: 4px !important; }"
        + ".ui-outlined-input-input { font-size: 14px !important; padding: 8px 4px !important; }"
        + ".ui-outlined-input fieldset { border: none !important; }"
        + ".ihf-email-field, .ui-form-control { max-width: 320px !important; margin-left: auto !important; margin-right: auto !important; }";
      document.head.appendChild(s);
    }
    setInterval(() => this._ihfFixAllShadowRoots(), 500);
  };
  ihfListingSearchRef = (node) => {
    if (!node || node.dataset.ihfMounted) return;
    const mount = () => {
      if (!window.ihfKestrel || !window.ihfKestrel.render) { setTimeout(mount, 150); return; }
      node.dataset.ihfMounted = '1';
      node.appendChild(window.ihfKestrel.render({ component: 'listingSearchWidget' }));
      this._ihfStartCaseFix();
    };
    mount();
  };
  openContactModal = (e) => { if (e) e.preventDefault(); if (window.openKeseckerContactModal) window.openKeseckerContactModal(); };
  togglePhonePopup = () => this.setState(s => ({ isPhoneOpen: !s.isPhoneOpen }));
  onPhoneClose = () => this.setState({ isPhoneOpen: false });
  renderVals() {
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q') || '';
    return {
      ihfListingSearchRef: this.ihfListingSearchRef, hasQuery: !!q, queryValue: q,
      openContactModal: this.openContactModal,
      isPhoneOpen: this.state.isPhoneOpen, togglePhonePopup: this.togglePhonePopup, onPhoneClose: this.onPhoneClose,
      phonePopoverStyle: this.state.isPhoneOpen ? 'opacity:1;visibility:visible;transform:translateY(0);transition:opacity 0.3s ease,transform 0.3s ease;' : 'opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity 0.3s ease,transform 0.3s ease;',
    };
  }
}
</script>
</body>
</html>
